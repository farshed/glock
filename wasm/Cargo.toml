[package]
name = "glock-wasm"
version = "0.1.0"
edition = "2021"
description = "Filesystem-free tokei counting, compiled to wasm for the Glock extension."

[lib]
crate-type = ["cdylib"]

[dependencies]
# Disabling the CLI feature is what keeps the filesystem- and terminal-bound
# dependencies out of the wasm build.
tokei = { version = "14", default-features = false }
encoding_rs_io = "0.1.7"

[profile.release]
opt-level = "z"
lto = true
panic = "abort"
strip = true
